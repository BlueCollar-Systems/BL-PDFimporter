name: auto-release

on:
  push:
    branches: [main, master]
    # Docs-only pushes do not mint a release (board Q-08-a / ANS-09-1).
    # Release-pipeline workflow edits under .github/ are NOT ignored: they must
    # rebuild --latest assets. The job if: guard skips chore: bump version to
    # commits, so there is no release loop.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "_archived/**"
      - "dist/_archived/**"
      - "dev_logs/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version to') && !contains(github.event.head_commit.message, 'automation/version-bump') && !contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          # GITHUB_TOKEN always authenticates checkout; RELEASE_BUMP_TOKEN is used
          # only when pushing the version-bump commit past branch protection.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read committed version
        id: version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          init_file = pathlib.Path("pdf_vector_importer/__init__.py")
          pyproject = pathlib.Path("pyproject.toml")

          init_text = init_file.read_text(encoding="utf-8")
          match = re.search(r'("version":\s*\()(\d+),\s*(\d+),\s*(\d+)(\))', init_text)
          if not match:
              raise SystemExit('Could not parse version tuple from pdf_vector_importer/__init__.py')

          major, minor, patch = map(int, match.groups()[1:4])
          version = f"{major}.{minor}.{patch}"

          pyproject_text = pyproject.read_text(encoding="utf-8")
          pyproject_match = re.search(r'^version\s*=\s*"(\d+\.\d+\.\d+)"', pyproject_text, re.MULTILINE)
          if not pyproject_match or pyproject_match.group(1) != version:
              got = pyproject_match.group(1) if pyproject_match else "missing"
              raise SystemExit(f"Version mismatch: core={version} pyproject={got}")

          # RB-22: README badge is a quick-card §4.2 bump site — gate it too
          # (same pattern as FreeCAD/SketchUp auto-release).
          readme_text = pathlib.Path("README.md").read_text(encoding="utf-8")
          badge_match = re.search(r"Version-(\d+\.\d+\.\d+)-(?:green|blue)\.svg", readme_text)
          if not badge_match or badge_match.group(1) != version:
              got = badge_match.group(1) if badge_match else "missing"
              raise SystemExit(f"Version mismatch: core={version} README badge={got}")

          legacy_init = pathlib.Path("blender_pdf_vector_importer/__init__.py")
          if legacy_init.exists():
              legacy_text = legacy_init.read_text(encoding="utf-8")
              legacy_match = re.search(r'("version":\s*\()(\d+),\s*(\d+),\s*(\d+)(\))', legacy_text)
              if not legacy_match:
                  raise SystemExit("Could not parse version tuple from blender_pdf_vector_importer/__init__.py")
              legacy_version = ".".join(legacy_match.groups()[1:4])
              if legacy_version != version:
                  raise SystemExit(f"Version mismatch: core={version} legacy={legacy_version}")

          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(f"version={version}\n", encoding="utf-8")
          PY

      - name: Plan atomic release completion
        id: release_plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          cp scripts/release_safety.py "$RUNNER_TEMP/release_safety.py"
          TAG_SHA="$(git rev-list -n 1 "$TAG^{commit}" 2>/dev/null || true)"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          DISCOVERY="$(python "$RUNNER_TEMP/release_safety.py" discover-release \
            --releases-json "$RUNNER_TEMP/releases.json" --tag "$TAG")"
          RELEASE_STATE="$(printf '%s' "$DISCOVERY" | jq -r .release_state)"
          RELEASE_ID="$(printf '%s' "$DISCOVERY" | jq -r .release_id)"
          if [ -n "$RELEASE_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$RUNNER_TEMP/release.json"
          else
            printf '%s\n' '{"assets":[]}' > "$RUNNER_TEMP/release.json"
          fi
          python "$RUNNER_TEMP/release_safety.py" plan-release \
            --version "${{ steps.version.outputs.version }}" \
            --head-sha "$GITHUB_SHA" \
            --tag-sha "$TAG_SHA" \
            --release-state "$RELEASE_STATE" \
            --github-output "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable release source
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.release_plan.outputs.build_ref }}"
          test "$(git rev-parse HEAD)" = "${{ steps.release_plan.outputs.build_ref }}"

      - name: Run release gate tests on selected source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "PyMuPDF>=1.24,<2.0" "fonttools==4.60.2" pytest
          python pdfcadcore_sync_check.py --skip-cross-repo
          python -m pytest tests/ -q --basetemp "$RUNNER_TEMP/pytest-blender"
          python tests/test_release_safety.py

      - name: Build release
        env:
          BC_RELEASE_SOURCE_SHA: ${{ steps.release_plan.outputs.build_ref }}
        run: python build_release.py

      - name: Smoke shipped add-on ZIP
        run: python scripts/smoke_release_zip.py "dist/Blender-PDF-Importer_*.zip"

      - name: Complete or verify immutable release
        id: mint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTION="${{ steps.release_plan.outputs.action }}"
          TAG="${{ steps.release_plan.outputs.tag }}"
          RELEASE_TARGET="${{ steps.release_plan.outputs.release_target }}"
          RELEASE_ID="${{ steps.release_plan.outputs.release_id }}"
          TITLE="v${{ steps.version.outputs.version }} — PDF Vector Importer for Blender"
          RELEASE_JSON="$RUNNER_TEMP/release.json"
          refresh_release() {
            local attempt discovery
            for attempt in 1 2 3 4 5; do
              gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
              discovery="$(python "$RUNNER_TEMP/release_safety.py" discover-release \
                --releases-json "$RUNNER_TEMP/releases.json" --tag "$TAG")"
              RELEASE_STATE="$(printf '%s' "$discovery" | jq -r .release_state)"
              RELEASE_ID="$(printf '%s' "$discovery" | jq -r .release_id)"
              if [ -n "$RELEASE_ID" ]; then
                gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$RELEASE_JSON"
                return 0
              fi
              if [ "$attempt" -lt 5 ]; then
                sleep $((attempt * 2))
              fi
            done
            echo "Release $TAG did not become visible after five attempts." >&2
            return 1
          }
          shopt -s nullglob
          ASSETS=(dist/*.zip)
          if [ "${#ASSETS[@]}" -ne 1 ]; then
            echo "Expected exactly one release ZIP; found ${#ASSETS[@]}" >&2
            exit 1
          fi
          ASSET="${ASSETS[0]}"

          if [ "$ACTION" = "verify_existing_release" ]; then
            test -n "$RELEASE_ID"
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$RELEASE_JSON"
            python "$RUNNER_TEMP/release_safety.py" verify-release-assets \
              --release-json "$RELEASE_JSON" --asset "$ASSET" \
              --output "$RUNNER_TEMP/verified-release-assets.json"
            jq -e ".draft == false" "$RELEASE_JSON" >/dev/null
            jq -e ".immutable == true" "$RELEASE_JSON" >/dev/null
            echo "minted=false" >> "$GITHUB_OUTPUT"
            python "$RUNNER_TEMP/release_safety.py" audit-existing-tag \
              --repo "${GITHUB_REPOSITORY}" \
              --tag "$TAG" \
              --before "${{ github.event.before }}" \
              --head "$GITHUB_SHA" \
              --session-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --mode release \
              --summary "$GITHUB_STEP_SUMMARY" \
              --warnings-file .release-safety/warnings.json
            exit 0
          fi

          if [ "$ACTION" = "mint_new_tag" ]; then
            git tag "$TAG" "$RELEASE_TARGET"
            if ! git push origin "refs/tags/${TAG}"; then
              git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
              test "$(git rev-list -n 1 "$TAG^{commit}")" = "$RELEASE_TARGET"
            fi
          fi

          if [ "$ACTION" != "complete_draft_release" ]; then
            if ! gh release create "$TAG" --verify-tag --target "$RELEASE_TARGET" --title "$TITLE" --generate-notes --draft; then
              refresh_release
              if jq -e ".draft == false" "$RELEASE_JSON" >/dev/null; then
                python "$RUNNER_TEMP/release_safety.py" verify-release-assets \
                  --release-json "$RELEASE_JSON" --asset "$ASSET" \
                  --output "$RUNNER_TEMP/verified-raced-release-assets.json"
                jq -e ".immutable == true" "$RELEASE_JSON" >/dev/null
                echo "minted=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              jq -e ".draft == true" "$RELEASE_JSON" >/dev/null
            else
              refresh_release
            fi
          fi

          refresh_release
          jq -e ".draft == true" "$RELEASE_JSON" >/dev/null
          ASSET_NAME="$(basename "$ASSET")"
          ASSET_COUNT="$(jq --arg name "$ASSET_NAME" '[.assets[] | select(.name == $name)] | length' "$RELEASE_JSON")"
          if [ "$ASSET_COUNT" = "0" ]; then
            if ! gh release upload "$TAG" "$ASSET"; then
              refresh_release
              python "$RUNNER_TEMP/release_safety.py" verify-release-assets \
                --release-json "$RELEASE_JSON" --asset "$ASSET" \
                --output "$RUNNER_TEMP/verified-raced-upload-assets.json"
            fi
          elif [ "$ASSET_COUNT" != "1" ]; then
            echo "Release contains duplicate assets named ${ASSET_NAME}" >&2
            exit 1
          fi

          refresh_release
          python "$RUNNER_TEMP/release_safety.py" verify-release-assets \
            --release-json "$RELEASE_JSON" --asset "$ASSET" \
            --output "$RUNNER_TEMP/verified-release-assets.json"
          if ! gh release edit "$TAG" --draft=false --latest; then
            refresh_release
            jq -e ".draft == false" "$RELEASE_JSON" >/dev/null
          fi
          refresh_release
          jq -e ".draft == false" "$RELEASE_JSON" >/dev/null
          jq -e ".immutable == true" "$RELEASE_JSON" >/dev/null
          python "$RUNNER_TEMP/release_safety.py" verify-release-assets \
            --release-json "$RELEASE_JSON" --asset "$ASSET" \
            --output "$RUNNER_TEMP/verified-published-assets.json"
          echo "minted=true" >> "$GITHUB_OUTPUT"

      - name: Check website dispatch token secret
        if: steps.mint.outputs.minted == 'true'
        id: website_dispatch_token
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN || secrets.BLUECOLLAR_WEBSITE_DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN }}
        run: |
          if [ -n "$WEBSITE_DISPATCH_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch website release update
        if: steps.mint.outputs.minted == 'true' && steps.website_dispatch_token.outputs.has_token == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.WEBSITE_DISPATCH_TOKEN || secrets.BLUECOLLAR_WEBSITE_DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN }}
          script: |
            const tag = 'v${{ steps.version.outputs.version }}';
            const payload = {
              source_repo: context.repo.owner + '/' + context.repo.repo,
              source_event: 'auto-release',
              source_ref: context.ref,
              source_sha: context.sha,
              release_tag: tag,
              release_name: tag,
              release_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`,
            };

            await github.request('POST /repos/{owner}/{repo}/dispatches', {
              owner: 'BlueCollar-Systems',
              repo: 'BlueCollar-Website',
              event_type: 'product-release',
              client_payload: payload,
            });

            core.info('Dispatched product-release to BlueCollar-Website');

      - name: Warn when website dispatch token is missing
        if: steps.mint.outputs.minted == 'true' && steps.website_dispatch_token.outputs.has_token != 'true'
        run: |
          echo "::warning::Skipping website dispatch because no valid dispatch token secret is configured."
          echo "Set WEBSITE_DISPATCH_TOKEN (or BLUECOLLAR_WEBSITE_DISPATCH_TOKEN / REPO_DISPATCH_TOKEN) to enable cross-repo dispatch."
