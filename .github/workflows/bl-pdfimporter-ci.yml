name: bl-pdfimporter-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: bl-pdfimporter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Source-compat guard for Blender 3.0/3.1 hosts (Python 3.9).
  # Syntax-only: the vendored PyMuPDF wheel is cp310-abi3, so the full
  # dependency suite runs on >=3.10 (D5 ABI floor).
  legacy-syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all Python modules (legacy floor)
        run: python -m compileall pdf_vector_importer blender_pdf_vector_importer

  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check pyproject/bl_info version consistency
        run: |
          PYPROJECT_VER=$(grep -oP '(?<=^version = ")[^"]+' pyproject.toml | head -n1)
          MAIN_VER=$(grep -oP '"version":\s*\(\K[0-9]+,\s*[0-9]+,\s*[0-9]+' pdf_vector_importer/__init__.py | head -n1 | tr -d ' ' | tr ',' '.')
          LEGACY_VER=$(grep -oP '"version":\s*\(\K[0-9]+,\s*[0-9]+,\s*[0-9]+' blender_pdf_vector_importer/__init__.py | head -n1 | tr -d ' ' | tr ',' '.')
          echo "pyproject=$PYPROJECT_VER main=$MAIN_VER legacy=$LEGACY_VER"
          if [ -z "$PYPROJECT_VER" ] || [ -z "$MAIN_VER" ] || [ -z "$LEGACY_VER" ]; then
            echo "ERROR: could not read one or more versions"
            exit 1
          fi
          if [ "$PYPROJECT_VER" != "$MAIN_VER" ] || [ "$PYPROJECT_VER" != "$LEGACY_VER" ]; then
            echo "ERROR: version mismatch (pyproject=$PYPROJECT_VER main=$MAIN_VER legacy=$LEGACY_VER)"
            exit 1
          fi


  # The bundled PyMuPDF is cp310-abi3-win_amd64. smoke_release_zip.py only performs
  # the "does the vendored runtime actually import" check under sys.platform ==
  # "win32", and every other job here runs ubuntu-latest -- so that check had never
  # executed in CI. A release could have shipped a runtime that cannot load, with CI
  # fully green. This job exists solely to run it on the platform the bundle targets.
  release-zip-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install "fonttools==4.60.2"

      - name: Build shipped add-on ZIP
        run: python build_release.py

      - name: Smoke the ZIP (exercises the vendored PyMuPDF import on Windows)
        shell: bash
        run: python scripts/smoke_release_zip.py "dist/Blender-PDF-Importer_*.zip"

  syntax-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all Python modules
        run: python -m compileall pdf_vector_importer

      - name: Install ruff
        run: pip install ruff

      - name: Lint (functional + bugbear)
        run: ruff check --select F,B pdf_vector_importer

      - name: Install dependencies
        run: pip install "PyMuPDF>=1.24,<2.0" "fonttools==4.60.2" pytest

      - name: Verify pdfcadcore sync manifest
        run: python pdfcadcore_sync_check.py --skip-cross-repo

      - name: Run unit tests
        run: python -m pytest tests/ -v

      # Corpus gate (R21-15c): token-clone pattern from FC 1a9df9f, one matrix
      # leg only. Replaces the former path-secret gate, which could never
      # resolve to a directory on hosted runners (permanent silent skip).
      # The public FreeCAD repo is cloned because the conformance runner's
      # python leg imports pdfcadcore from $BCS_FREECAD_REPO/PDFVectorImporter.
      # D-4 (round 21 deferral QS-4): the public SketchUp repo is cloned so the
      # runner's sketchup legs execute instead of visible-skipping; without
      # $BCS_SKETCHUP_REPO the runner defaults to a Windows path that never
      # exists here, and its own R4-2 skip logic handles any absence (ruby is
      # preinstalled on ubuntu runners; guarded anyway).
      - name: Optional corpus clone (CORPUS_READ_TOKEN)
        if: matrix.python-version == '3.12'
        env:
          CORPUS_READ_TOKEN: ${{ secrets.CORPUS_READ_TOKEN }}
        run: |
          if [ -z "$CORPUS_READ_TOKEN" ]; then
            echo "::notice::CORPUS_READ_TOKEN not set; corpus matrix gate visible-skip (R4-2)"
            echo "corpus_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${CORPUS_READ_TOKEN}@github.com/BlueCollar-Systems/pdf-test-corpus.git" "$RUNNER_TEMP/pdf-test-corpus"
          git clone --depth 1 "https://github.com/BlueCollar-Systems/PDF-Importer-FreeCAD.git" "$RUNNER_TEMP/PDF-Importer-FreeCAD"
          echo "corpus_available=true" >> "$GITHUB_OUTPUT"
          echo "BCS_CORPUS_ROOT=$RUNNER_TEMP/pdf-test-corpus" >> "$GITHUB_ENV"
          echo "BCS_FREECAD_REPO=$RUNNER_TEMP/PDF-Importer-FreeCAD" >> "$GITHUB_ENV"
          if command -v ruby >/dev/null 2>&1; then
            ruby --version
            git clone --depth 1 "https://github.com/BlueCollar-Systems/PDF-Importer-SketchUp.git" "$RUNNER_TEMP/PDF-Importer-SketchUp"
            echo "BCS_SKETCHUP_REPO=$RUNNER_TEMP/PDF-Importer-SketchUp" >> "$GITHUB_ENV"
          else
            echo "::notice::ruby not on PATH; SketchUp conformance legs visible-skip (R4-2, D-4)"
          fi
        id: corpus

      - name: Corpus schema + conformance-vector gate
        if: matrix.python-version == '3.12' && steps.corpus.outputs.corpus_available == 'true'
        run: |
          python "$BCS_CORPUS_ROOT/tools/validate_contract_schemas.py"
          python "$BCS_CORPUS_ROOT/conformance-vectors/test_conformance_vectors.py"

      - name: Build and smoke shipped add-on ZIP
        run: |
          python build_release.py
          python scripts/smoke_release_zip.py "dist/Blender-PDF-Importer_*.zip"

      - name: Preset matrix smoke test
        run: |
          python -c "
          import sys, math
          sys.path.insert(0, '.')
          from blender_pdf_vector_importer.importer import run_import
          import fitz, tempfile, os

          # Build a mixed-content sample PDF (geometry + text + arcs + fills)
          tmp = tempfile.NamedTemporaryFile(suffix='.pdf', delete=False)
          doc = fitz.open()
          p = doc.new_page(width=612, height=792)
          p.draw_line((50,50),(300,50), color=(0,0,0), width=1)
          p.draw_circle((200,400), 30, color=(1,0,0), width=0.5)
          for i in range(8):
              a = 2*math.pi*i/8
              x, y = 400+25*math.cos(a), 300+25*math.sin(a)
              p.draw_line((400,300),(x,y), color=(0,0,1), width=0.3)
          tw = fitz.TextWriter(p.rect)
          tw.append((100,700), 'BOLT 3/4\" DIA', fontsize=12)
          tw.write_text(p)
          p2 = doc.new_page(width=612, height=792)
          p2.draw_rect((50,50,560,740), color=(0,0,0), width=0.5)
          doc.save(tmp.name)
          doc.close()

          modes = ['auto', 'vector', 'raster', 'hybrid']
          errors = []
          for mode in modes:
              try:
                  r = run_import(tmp.name, mode=mode,
                                 overrides={'pages': 'all'})
                  s = r.extraction.summary()
              except Exception as e:
                  errors.append(f'{mode}: {e}')

          os.unlink(tmp.name)
          if errors:
              for e in errors: print(f'FAIL: {e}')
              sys.exit(1)
          print(f'PASS: {len(modes)} BCS-ARCH-001 modes verified')
          "
